apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'

// Debug-only test tool. Never installed on customer phones; not part of the PrintSaathi APK.
android {
    namespace = "in.printsaathi.sharesender"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "in.printsaathi.sharesender"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    kotlinOptions { jvmTarget = '21' }
    // Round 9: the Office file builders shared with the app's JVM and device tests (synthetic files only).
    sourceSets { main.java.srcDirs += ['../app/src/sharedTest/java'] }
}

// Test tool only: there is no release variant to build or ship by mistake (Gate 2 minor 14).
androidComponents {
    beforeVariants(selector().withBuildType("release")) { it.enable = false }
}

dependencies {
    implementation "androidx.core:core:$androidxCoreVersion"
}

dependencyLocking {
    lockAllConfigurations()
    // STRICT: a configuration without a lock state fails the build instead of resolving freely.
    lockMode = LockMode.STRICT
}
